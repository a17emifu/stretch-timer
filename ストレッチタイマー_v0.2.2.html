<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#15131c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>ストレッチタイマー v0.2.2</title>
<!-- アイコン / PWA メタタグ -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
<meta name="application-name" content="ストレッチタイマー" />
<meta name="apple-mobile-web-app-title" content="ストレッチ" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #15131c;
    --bg-soft: #1d1a26;
    --text: #f5ede0;
    --text-dim: #8a8290;
    --text-faint: #4a4554;
    --main: #e8985f;
    --main-soft: rgba(232, 152, 95, 0.14);
    --main-glow: rgba(232, 152, 95, 0.35);
    --interval: #7cb097;
    --interval-soft: rgba(124, 176, 151, 0.14);
    --interval-glow: rgba(124, 176, 151, 0.30);
    --prep: #c9b8d6;
    --prep-soft: rgba(201, 184, 214, 0.12);
    --accent: var(--main);
    --accent-soft: var(--main-soft);
    --accent-glow: var(--main-glow);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(232,152,95,0.10), transparent 55%),
      radial-gradient(120% 80% at 50% 100%, rgba(124,176,151,0.08), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    min-height: 100dvh;
    transition: background 0.8s ease;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  body[data-phase="interval"] {
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(124,176,151,0.14), transparent 55%),
      radial-gradient(120% 80% at 50% 100%, rgba(232,152,95,0.05), transparent 60%),
      var(--bg);
  }
  body[data-phase="main"] {
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(232,152,95,0.16), transparent 55%),
      radial-gradient(120% 80% at 50% 100%, rgba(124,176,151,0.05), transparent 60%),
      var(--bg);
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    padding: 18px 22px 26px;
    position: relative;
  }

  /* ヘッダ */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 18px;
    letter-spacing: 0.04em;
    color: var(--text);
  }
  .brand em {
    font-style: italic;
    color: var(--accent);
    transition: color 0.6s ease;
  }
  .version {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.06em;
  }

  /* 設定パネル */
  .settings {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }
  .field {
    background: var(--bg-soft);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 14px;
    padding: 12px 14px;
    position: relative;
    overflow: hidden;
  }
  .field::before {
    content: '';
    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;
    background: var(--accent);
    opacity: 0.35;
  }
  .field.interval::before { background: var(--interval); }
  .field label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .field .val {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .field .val input {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 28px;
    width: 64px;
    padding: 0;
    -moz-appearance: textfield;
    outline: none;
  }
  .field .val input::-webkit-outer-spin-button,
  .field .val input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .field .unit {
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.06em;
  }

  /* 中央ステージ */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 0;
  }

  .phase-label {
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 14px;
    font-weight: 700;
    height: 14px;
    transition: color 0.4s ease;
  }
  body[data-phase="main"] .phase-label { color: var(--main); }
  body[data-phase="interval"] .phase-label { color: var(--interval); }
  body[data-phase="prep"] .phase-label { color: var(--prep); }

  /* リングと時間表示 */
  .ring-wrap {
    position: relative;
    width: min(78vw, 340px);
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ring {
    position: absolute;
    inset: 0;
    transform: rotate(-90deg);
  }
  .ring circle {
    fill: none;
    stroke-width: 4;
    stroke-linecap: round;
  }
  .ring .track { stroke: rgba(255,255,255,0.05); }
  .ring .progress {
    stroke: var(--accent);
    transition: stroke-dashoffset 0.18s linear, stroke 0.5s ease;
    filter: drop-shadow(0 0 12px var(--accent-glow));
  }

  .time {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: clamp(80px, 22vw, 140px);
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .time .sec {
    font-size: 0.32em;
    color: var(--text-dim);
    margin-left: 4px;
    letter-spacing: 0.04em;
    font-style: italic;
    font-weight: 400;
  }

  .cycle-info {
    margin-top: 14px;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--text-faint);
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
  }
  .cycle-info b { color: var(--text-dim); font-weight: 500; }

  /* コントロール */
  .controls {
    display: flex;
    gap: 14px;
    justify-content: center;
    align-items: center;
    padding-top: 18px;
  }
  .btn {
    background: var(--bg-soft);
    border: 1px solid rgba(255,255,255,0.06);
    color: var(--text);
    border-radius: 999px;
    padding: 16px 26px;
    font-family: 'Manrope', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    -webkit-user-select: none;
    user-select: none;
  }
  .btn:active { transform: scale(0.96); }
  .btn:hover { border-color: rgba(255,255,255,0.12); }
  .btn .icon { width: 14px; height: 14px; }
  .btn.primary {
    background: var(--accent);
    color: #1a1622;
    border-color: transparent;
    box-shadow: 0 8px 30px var(--accent-glow);
    padding: 18px 32px;
  }
  .btn.primary:hover { filter: brightness(1.05); border-color: transparent; }
  .btn.ghost { background: transparent; }

  .btn[disabled] { opacity: 0.35; pointer-events: none; }

  /* フッタヒント */
  .hint {
    text-align: center;
    margin-top: 14px;
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.08em;
    min-height: 14px;
  }

  /* パルスアニメーション（カウントダウン時） */
  @keyframes pulse-tick {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  .time.tick { animation: pulse-tick 0.5s ease; }

  /* レスポンシブ調整 */
  @media (max-width: 380px) {
    .settings { grid-template-columns: 1fr; }
    .btn { padding: 14px 20px; font-size: 13px; }
    .btn.primary { padding: 16px 26px; }
  }
  @media (min-height: 800px) {
    .ring-wrap { width: min(78vw, 400px); }
  }
</style>
</head>
<body data-phase="idle">
  <div class="app">
    <header>
      <div class="brand">Stretch <em>Tempo</em></div>
      <div class="version">v0.2.2</div>
    </header>

    <section class="settings" aria-label="時間設定">
      <div class="field" id="field-main">
        <label>メイン</label>
        <div class="val">
          <input type="number" id="mainInput" min="0" max="60" step="1" value="30" inputmode="numeric" />
          <span class="unit">秒 / 0–60</span>
        </div>
      </div>
      <div class="field interval" id="field-interval">
        <label>インターバル</label>
        <div class="val">
          <input type="number" id="intervalInput" min="3" max="10" step="1" value="5" inputmode="numeric" />
          <span class="unit">秒 / 3–10</span>
        </div>
      </div>
    </section>

    <main class="stage">
      <div class="phase-label" id="phaseLabel">READY</div>
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="track" cx="100" cy="100" r="94"></circle>
          <circle class="progress" id="ringProgress" cx="100" cy="100" r="94"
                  stroke-dasharray="590.62" stroke-dashoffset="590.62"></circle>
        </svg>
        <div class="time" id="timeDisplay">30<span class="sec">s</span></div>
      </div>
      <div class="cycle-info">
        <span><b>サイクル</b> <span id="cycleCount">0</span></span>
        &nbsp;·&nbsp;
        <span><b>経過</b> <span id="totalElapsed">00:00</span></span>
      </div>
    </main>

    <div class="controls">
      <button class="btn ghost" id="stopBtn" aria-label="完全停止" disabled>
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
        停止
      </button>
      <button class="btn primary" id="playBtn" aria-label="再生/一時停止">
        <svg class="icon" id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span id="playLabel">スタート</span>
      </button>
    </div>

    <div class="hint" id="hint">▶ ボタンで開始。最初に3秒のカウントが入ります</div>
  </div>

<script>
/* ============================================================
   ストレッチタイマー v0.2.0
   - Web Audio APIで全効果音を合成生成（外部ファイル不要）
   - performance.now() ベースの精密タイマー
   - v0.1.1: メイン→インターバルの無限ループ不具合を修正
   - v0.2.0: メイン用/インターバル用の効果音を聞き分け可能なほど
             明確に分離（音域・音色・エンベロープを全面再設計）。
             メイン終了→インターバル開始に1秒の間を追加。
   - v0.2.1: メインのカウント音が高すぎて刺さる問題を修正。
             square波と2640Hzを廃止、G5/D6のtriangle+sineに変更。
   - v0.2.2: ホーム画面アイコン用のPNGとmanifest.jsonを追加。
             PWA的な「アプリらしい」起動が可能に。
   ============================================================ */

/* ---------- 設定 ---------- */
const CONFIG = {
  PREP_SECONDS: 3,
  MAIN_MIN: 0, MAIN_MAX: 60, MAIN_DEFAULT: 30,
  INTERVAL_MIN: 3, INTERVAL_MAX: 10, INTERVAL_DEFAULT: 5,
  COUNTDOWN_FROM: 3, // 終了X秒前からカウント音
};

/* ---------- DOM ---------- */
const el = {
  body: document.body,
  mainInput: document.getElementById('mainInput'),
  intervalInput: document.getElementById('intervalInput'),
  phaseLabel: document.getElementById('phaseLabel'),
  time: document.getElementById('timeDisplay'),
  ring: document.getElementById('ringProgress'),
  cycle: document.getElementById('cycleCount'),
  totalElapsed: document.getElementById('totalElapsed'),
  playBtn: document.getElementById('playBtn'),
  playIcon: document.getElementById('playIcon'),
  playLabel: document.getElementById('playLabel'),
  stopBtn: document.getElementById('stopBtn'),
  hint: document.getElementById('hint'),
};

const RING_CIRCUMFERENCE = 2 * Math.PI * 94;
el.ring.setAttribute('stroke-dasharray', RING_CIRCUMFERENCE.toFixed(2));
el.ring.setAttribute('stroke-dashoffset', RING_CIRCUMFERENCE.toFixed(2));

/* ---------- 状態 ---------- */
const State = {
  IDLE: 'idle',
  PREP: 'prep',
  MAIN: 'main',
  INTERVAL: 'interval',
};
let state = State.IDLE;
let isPaused = false;
let phaseStartTs = 0;       // 現フェーズ開始時刻 (performance.now)
let phaseDuration = 0;      // 現フェーズの長さ(秒)
let pausedRemaining = 0;    // 一時停止時の残り秒
let cycleCount = 0;
let totalElapsedSec = 0;    // 全体経過(再生時間ベース)
let lastTickTs = 0;
let beepedSecond = -1;      // カウント音重複防止用
let rafId = null;
let transitionTimerId = null; // メイン→インターバル間の遅延タイマー

/* ============================================================
   オーディオエンジン
   設計方針：
   - メイン  = 高音域(1000-2600Hz)、明るい金属/ベル系。覚醒・集中
   - インターバル = 低音域(100-330Hz)、ローパス通過の温かい木質/パッド系。休息
   - 周波数で約10倍離してあるので、聞き分けは即座に可能
   ============================================================ */
const Audio = (() => {
  let ctx = null;
  let masterGain = null;

  function ensure() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = ctx.createGain();
      masterGain.gain.value = 0.7;
      masterGain.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  // 基本トーン（エンベロープ付き、出力先指定可）
  function tone({ freq, type = 'sine', dur = 0.4, attack = 0.005, gain = 0.3, detune = 0, dest = null }) {
    const c = ensure();
    const t0 = c.currentTime;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.detune.value = detune;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(dest || masterGain);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  // ローパス通過の柔らかいトーン（インターバル用）
  function softTone(opts) {
    const c = ensure();
    const filter = c.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = opts.cutoff || 800;
    filter.Q.value = 0.7;
    filter.connect(masterGain);
    tone({ ...opts, dest: filter });
  }

  /* ---------- MAIN（メイン）系：高音・明るい・覚醒 ---------- */

  // メイン開始：C6→E6→G6 の素早い上昇アルペジオ + キラキラ余韻
  function mainStart() {
    ensure();
    const notes = [1046.5, 1318.5, 1568.0]; // C6, E6, G6
    notes.forEach((f, i) => {
      setTimeout(() => {
        tone({ freq: f,     type: 'triangle', dur: 0.32, attack: 0.002, gain: 0.30 });
        tone({ freq: f * 2, type: 'sine',     dur: 0.40, attack: 0.005, gain: 0.10 });
      }, i * 70);
    });
    setTimeout(() => tone({ freq: 2093, type: 'sine', dur: 0.55, attack: 0.01, gain: 0.08 }), 220);
  }

  // メイン中のカウント音(残り3,2,1)：聞きやすい中高域。
  // 旧版の1320Hz square + 2640Hz sineは耳に刺さるため廃止。
  // 基音 G5(784Hz) triangle、倍音 D6(1175Hz) sineで丸く明るく。
  function mainTick() {
    tone({ freq: 784,  type: 'triangle', dur: 0.11, attack: 0.004, gain: 0.22 });
    tone({ freq: 1175, type: 'sine',     dur: 0.09, attack: 0.006, gain: 0.07 });
  }

  // メイン終了：達成感のある瞑想ベル（C6+G6+C7、長い減衰）
  function mainEnd() {
    ensure();
    tone({ freq: 1046.5, type: 'triangle', dur: 0.95, attack: 0.003, gain: 0.30 });
    tone({ freq: 1568.0, type: 'sine',     dur: 1.00, attack: 0.005, gain: 0.18 });
    tone({ freq: 2093.0, type: 'sine',     dur: 0.90, attack: 0.010, gain: 0.08 });
  }

  /* ---------- INTERVAL（インターバル）系：低音・温かい・休息 ---------- */

  // インターバル開始：低音のため息のような温かいパッド (A2+A3+E4、ローパス)
  function intervalStart() {
    softTone({ freq: 110,    type: 'sine',     dur: 1.10, attack: 0.10, gain: 0.20, cutoff: 600 });
    softTone({ freq: 220,    type: 'sine',     dur: 1.20, attack: 0.15, gain: 0.30, cutoff: 700 });
    softTone({ freq: 329.63, type: 'triangle', dur: 1.10, attack: 0.20, gain: 0.16, cutoff: 700 });
  }

  // インターバル中のカウント音(残り3,2,1)：木の打音のような優しい低音クリック
  function intervalTick() {
    softTone({ freq: 196, type: 'sine',     dur: 0.18, attack: 0.002, gain: 0.28, cutoff: 500 });
    softTone({ freq: 98,  type: 'triangle', dur: 0.20, attack: 0.003, gain: 0.20, cutoff: 350 });
  }

  /* ---------- 準備カウント（最初の3秒）：中立的なクリック ---------- */
  function prepTick() {
    tone({ freq: 660, type: 'sine', dur: 0.14, attack: 0.003, gain: 0.20 });
  }

  return { ensure, mainStart, mainEnd, mainTick, intervalStart, intervalTick, prepTick };
})();

/* ============================================================
   設定値のバリデーション
   ============================================================ */
function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }

function getMainSec() {
  const v = parseInt(el.mainInput.value, 10);
  return Number.isFinite(v) ? clamp(v, CONFIG.MAIN_MIN, CONFIG.MAIN_MAX) : CONFIG.MAIN_DEFAULT;
}
function getIntervalSec() {
  const v = parseInt(el.intervalInput.value, 10);
  return Number.isFinite(v) ? clamp(v, CONFIG.INTERVAL_MIN, CONFIG.INTERVAL_MAX) : CONFIG.INTERVAL_DEFAULT;
}

el.mainInput.addEventListener('change', () => {
  el.mainInput.value = getMainSec();
  if (state === State.IDLE) updateIdleDisplay();
});
el.intervalInput.addEventListener('change', () => {
  el.intervalInput.value = getIntervalSec();
});

/* ============================================================
   表示更新
   ============================================================ */
function setAccent(phase) {
  el.body.setAttribute('data-phase', phase);
  const root = document.documentElement.style;
  if (phase === 'main') {
    root.setProperty('--accent', 'var(--main)');
    root.setProperty('--accent-soft', 'var(--main-soft)');
    root.setProperty('--accent-glow', 'var(--main-glow)');
  } else if (phase === 'interval') {
    root.setProperty('--accent', 'var(--interval)');
    root.setProperty('--accent-soft', 'var(--interval-soft)');
    root.setProperty('--accent-glow', 'var(--interval-glow)');
  } else if (phase === 'prep') {
    root.setProperty('--accent', 'var(--prep)');
    root.setProperty('--accent-soft', 'var(--prep-soft)');
    root.setProperty('--accent-glow', 'rgba(201,184,214,0.25)');
  } else {
    root.setProperty('--accent', 'var(--main)');
    root.setProperty('--accent-soft', 'var(--main-soft)');
    root.setProperty('--accent-glow', 'var(--main-glow)');
  }
}

function setPhaseLabel(phase) {
  const map = { idle: 'READY', prep: 'GET READY', main: 'STRETCH', interval: 'REST' };
  el.phaseLabel.textContent = map[phase] || 'READY';
}

function setTimeDisplay(sec) {
  const s = Math.max(0, Math.ceil(sec));
  el.time.innerHTML = `${s}<span class="sec">s</span>`;
}

function setRing(progressRatio) {
  // progressRatio: 0(開始) → 1(終了)
  const offset = RING_CIRCUMFERENCE * (1 - progressRatio);
  el.ring.setAttribute('stroke-dashoffset', offset.toFixed(2));
}

function fmtMSS(totalSec) {
  const m = Math.floor(totalSec / 60);
  const s = Math.floor(totalSec % 60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function updateIdleDisplay() {
  setPhaseLabel(State.IDLE);
  setAccent(State.IDLE);
  setTimeDisplay(getMainSec());
  setRing(0);
  el.cycle.textContent = '0';
  el.totalElapsed.textContent = '00:00';
}

/* ============================================================
   状態遷移
   ============================================================ */
function startPhase(nextState) {
  state = nextState;
  beepedSecond = -1;
  setPhaseLabel(state);
  setAccent(state);

  if (state === State.PREP) {
    phaseDuration = CONFIG.PREP_SECONDS;
    el.hint.textContent = 'まもなくスタート…';
  } else if (state === State.MAIN) {
    phaseDuration = getMainSec();
    if (phaseDuration <= 0) {
      // メイン時間が0秒なら即インターバルへ
      startPhase(State.INTERVAL);
      return;
    }
    Audio.mainStart();
    el.hint.textContent = 'ストレッチを保持してください';
  } else if (state === State.INTERVAL) {
    phaseDuration = getIntervalSec();
    Audio.intervalStart();
    el.hint.textContent = '深呼吸、次の準備を';
    cycleCount += 1;
    el.cycle.textContent = String(cycleCount);
  }
  phaseStartTs = performance.now();
}

function nextPhase() {
  if (state === State.PREP) {
    startPhase(State.MAIN);
  } else if (state === State.MAIN) {
    Audio.mainEnd();
    // メイン終了後、1秒間を空けてからインターバル開始
    state = '_transition';
    el.hint.textContent = 'よくできました。1秒の間…';
    transitionTimerId = setTimeout(() => {
      transitionTimerId = null;
      if (state === '_transition') startPhase(State.INTERVAL);
    }, 1000);
  } else if (state === State.INTERVAL) {
    // インターバル終了 → そのままメインへループ
    startPhase(State.MAIN);
  }
}

/* ============================================================
   メインループ
   ============================================================ */
function tick(now) {
  if (!isPaused && state !== State.IDLE && state !== '_transition') {
    const elapsed = (now - phaseStartTs) / 1000;
    const remaining = phaseDuration - elapsed;

    // 経過時間更新（前tickからの差分）
    if (lastTickTs > 0) {
      totalElapsedSec += (now - lastTickTs) / 1000;
      el.totalElapsed.textContent = fmtMSS(totalElapsedSec);
    }
    lastTickTs = now;

    // 表示
    setTimeDisplay(remaining);
    setRing(clamp(elapsed / phaseDuration, 0, 1));

    // カウント音処理（残り3,2,1秒）
    const secCeil = Math.ceil(remaining);
    if (remaining > 0 && remaining <= CONFIG.COUNTDOWN_FROM && secCeil !== beepedSecond) {
      beepedSecond = secCeil;
      if (state === State.PREP) Audio.prepTick();
      else if (state === State.MAIN) Audio.mainTick();
      else if (state === State.INTERVAL) Audio.intervalTick();
      el.time.classList.remove('tick');
      void el.time.offsetWidth;
      el.time.classList.add('tick');
    }

    // フェーズ終了
    if (remaining <= 0) {
      nextPhase();
    }
  } else {
    lastTickTs = now;
  }
  rafId = requestAnimationFrame(tick);
}

/* ============================================================
   操作（再生/一時停止/停止）
   ============================================================ */
function play() {
  Audio.ensure(); // ユーザージェスチャ内で初期化
  if (state === State.IDLE) {
    cycleCount = 0;
    totalElapsedSec = 0;
    el.cycle.textContent = '0';
    el.totalElapsed.textContent = '00:00';
    isPaused = false;
    lastTickTs = 0;
    startPhase(State.PREP);
    setPlayingUI(true);
    if (!rafId) rafId = requestAnimationFrame(tick);
  } else if (isPaused) {
    // 再開
    isPaused = false;
    if (state === '_transition') {
      // トランジション中で停止していた場合、即インターバルへ進める
      startPhase(State.INTERVAL);
    } else {
      // 同じフェーズの残り秒から再開
      phaseStartTs = performance.now() - (phaseDuration - pausedRemaining) * 1000;
    }
    lastTickTs = 0;
    setPlayingUI(true);
    el.hint.textContent = '再開しました';
  } else {
    // 一時停止
    isPaused = true;
    // トランジション中なら、保留タイマーをキャンセル（再開時に再開）
    if (state === '_transition' && transitionTimerId) {
      clearTimeout(transitionTimerId);
      transitionTimerId = null;
    }
    const elapsed = (performance.now() - phaseStartTs) / 1000;
    pausedRemaining = Math.max(0, phaseDuration - elapsed);
    setPlayingUI(false, true);
    el.hint.textContent = '一時停止中  ▶ で再開';
  }
}

function stopAll() {
  state = State.IDLE;
  isPaused = false;
  cycleCount = 0;
  totalElapsedSec = 0;
  beepedSecond = -1;
  pausedRemaining = 0;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (transitionTimerId) { clearTimeout(transitionTimerId); transitionTimerId = null; }
  updateIdleDisplay();
  setPlayingUI(false, false);
  el.hint.textContent = '停止しました。▶ で再開できます';
}

function setPlayingUI(isPlaying, isPausedUI = false) {
  el.stopBtn.disabled = !isPlaying && !isPausedUI;
  if (isPlaying) {
    // 再生中 → 一時停止アイコン表示
    el.playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
    el.playLabel.textContent = '一時停止';
  } else {
    // 停止中 or 一時停止中 → 再生アイコン
    el.playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    el.playLabel.textContent = isPausedUI ? '再開' : 'スタート';
  }
}

el.playBtn.addEventListener('click', play);
el.stopBtn.addEventListener('click', stopAll);

// スペースキーでも操作可能（PC用）
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); play(); }
  else if (e.code === 'Escape') { stopAll(); }
});

// 初期表示
updateIdleDisplay();

// 画面スリープ抑止（対応ブラウザのみ）
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (_) { /* noop */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state !== State.IDLE) requestWakeLock();
});
el.playBtn.addEventListener('click', requestWakeLock, { once: false });
</script>
</body>
</html>
