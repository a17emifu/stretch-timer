<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#15131c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>ストレッチタイマー v0.3.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #15131c;
    --bg-soft: #1d1a26;
    --text: #f5ede0;
    --text-dim: #8a8290;
    --text-faint: #4a4554;
    --main: #e8985f;
    --main-soft: rgba(232, 152, 95, 0.14);
    --main-glow: rgba(232, 152, 95, 0.35);
    --interval: #7cb097;
    --interval-soft: rgba(124, 176, 151, 0.14);
    --interval-glow: rgba(124, 176, 151, 0.30);
    --prep: #c9b8d6;
    --prep-soft: rgba(201, 184, 214, 0.12);
    --accent: var(--main);
    --accent-soft: var(--main-soft);
    --accent-glow: var(--main-glow);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(232,152,95,0.10), transparent 55%),
      radial-gradient(120% 80% at 50% 100%, rgba(124,176,151,0.08), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    min-height: 100dvh;
    transition: background 0.8s ease;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  body[data-phase="interval"] {
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(124,176,151,0.14), transparent 55%),
      radial-gradient(120% 80% at 50% 100%, rgba(232,152,95,0.05), transparent 60%),
      var(--bg);
  }
  body[data-phase="main"] {
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(232,152,95,0.16), transparent 55%),
      radial-gradient(120% 80% at 50% 100%, rgba(124,176,151,0.05), transparent 60%),
      var(--bg);
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    padding: 18px 22px 26px;
    position: relative;
  }

  /* ヘッダ：brand / 音量 / version の3カラム1行 */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 18px;
    letter-spacing: 0.04em;
    color: var(--text);
    flex-shrink: 0;
    white-space: nowrap;
  }
  .brand b {
    font-weight: 500;
    color: var(--accent);
    transition: color 0.6s ease;
  }
  .version {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }

  /* 音量コントロール（ヘッダ内インライン版） */
  .volume-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-soft);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 999px;
    padding: 6px 12px 6px 10px;
    flex: 1;
    min-width: 0; /* flex子要素が縮めるように */
  }
  .volume-row .vol-icon {
    width: 14px;
    height: 14px;
    color: var(--text-dim);
    flex-shrink: 0;
    transition: color 0.2s ease;
  }
  .volume-row[data-muted="true"] .vol-icon {
    color: var(--text-faint);
  }
  .volume-row .vol-slider {
    flex: 1;
    min-width: 0;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 999px;
    outline: none;
    margin: 0;
    cursor: pointer;
    background-image: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--vol-pct, 50%), rgba(255,255,255,0.06) var(--vol-pct, 50%), rgba(255,255,255,0.06) 100%);
    transition: background-image 0.2s ease;
  }
  .volume-row .vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--text);
    border: 2px solid var(--accent);
    box-shadow: 0 2px 8px var(--accent-glow);
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.4s ease, box-shadow 0.4s ease;
  }
  .volume-row .vol-slider::-webkit-slider-thumb:active { transform: scale(1.15); }
  .volume-row .vol-slider::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text);
    border: 2px solid var(--accent);
    box-shadow: 0 2px 8px var(--accent-glow);
    cursor: pointer;
  }
  .volume-row .vol-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    min-width: 20px;
    text-align: right;
    font-weight: 500;
    flex-shrink: 0;
  }

  /* プリセット */
  .presets {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  .preset {
    background: var(--bg-soft);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 14px 10px 12px;
    cursor: pointer;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease, border-color 0.2s ease, background 0.3s ease;
    -webkit-user-select: none;
    user-select: none;
    font-family: inherit;
    color: inherit;
  }
  .preset:active { transform: scale(0.97); }
  .preset:hover { border-color: rgba(255,255,255,0.14); }

  .preset .preset-label {
    font-size: 9px;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    color: var(--text-faint);
    font-weight: 700;
    margin-bottom: 8px;
    font-family: 'JetBrains Mono', monospace;
  }
  .preset .preset-times {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 4px;
    line-height: 1;
  }
  .preset .t-main {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 32px;
    color: var(--text);
    letter-spacing: -0.02em;
  }
  .preset .t-sep {
    color: var(--text-faint);
    font-size: 14px;
    font-weight: 400;
    margin: 0 2px;
  }
  .preset .t-interval {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 20px;
    color: var(--text-dim);
    letter-spacing: -0.01em;
  }
  .preset .t-unit {
    font-size: 10px;
    color: var(--text-faint);
    margin-left: 1px;
    letter-spacing: 0.04em;
  }
  .preset .preset-meta {
    margin-top: 6px;
    font-size: 9px;
    letter-spacing: 0.16em;
    color: var(--text-faint);
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
  }

  .preset.active {
    border-color: var(--accent);
    background: linear-gradient(180deg, var(--accent-soft), var(--bg-soft) 60%);
    box-shadow: 0 6px 22px var(--accent-glow);
  }
  .preset.active .t-main { color: var(--accent); }
  .preset.active .preset-label { color: var(--text); }
  .preset.active::after {
    content: '';
    position: absolute;
    top: 8px; left: 50%;
    transform: translateX(-50%);
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
  }

  /* 中央ステージ */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 0;
  }

  .phase-label {
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 14px;
    font-weight: 700;
    height: 14px;
    transition: color 0.4s ease;
  }
  body[data-phase="main"] .phase-label { color: var(--main); }
  body[data-phase="interval"] .phase-label { color: var(--interval); }
  body[data-phase="prep"] .phase-label { color: var(--prep); }

  /* リングと時間表示 */
  .ring-wrap {
    position: relative;
    width: min(74vw, 320px);
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ring {
    position: absolute;
    inset: 0;
    transform: rotate(-90deg);
  }
  .ring circle {
    fill: none;
    stroke-width: 4;
    stroke-linecap: round;
  }
  .ring .track { stroke: rgba(255,255,255,0.05); }
  .ring .progress {
    stroke: var(--accent);
    transition: stroke-dashoffset 0.18s linear, stroke 0.5s ease;
    filter: drop-shadow(0 0 12px var(--accent-glow));
  }

  .time {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: clamp(80px, 22vw, 140px);
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .time .sec {
    font-size: 0.32em;
    color: var(--text-dim);
    margin-left: 4px;
    letter-spacing: 0.04em;
    font-weight: 400;
  }

  .cycle-info {
    margin-top: 14px;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--text-faint);
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
  }
  .cycle-info b { color: var(--text-dim); font-weight: 500; }

  /* コントロール */
  .controls {
    display: flex;
    gap: 14px;
    justify-content: center;
    align-items: center;
    padding-top: 18px;
  }
  .btn {
    background: var(--bg-soft);
    border: 1px solid rgba(255,255,255,0.06);
    color: var(--text);
    border-radius: 999px;
    padding: 16px 26px;
    font-family: 'Manrope', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    -webkit-user-select: none;
    user-select: none;
  }
  .btn:active { transform: scale(0.96); }
  .btn:hover { border-color: rgba(255,255,255,0.12); }
  .btn .icon { width: 14px; height: 14px; }
  .btn.primary {
    background: var(--accent);
    color: #1a1622;
    border-color: transparent;
    box-shadow: 0 8px 30px var(--accent-glow);
    padding: 18px 32px;
  }
  .btn.primary:hover { filter: brightness(1.05); border-color: transparent; }
  .btn.ghost { background: transparent; }

  .btn[disabled] { opacity: 0.35; pointer-events: none; }

  /* フッタヒント */
  .hint {
    text-align: center;
    margin-top: 14px;
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.08em;
    min-height: 14px;
  }

  /* パルスアニメーション（カウントダウン時） */
  @keyframes pulse-tick {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  .time.tick { animation: pulse-tick 0.5s ease; }

  /* レスポンシブ調整 */
  @media (max-width: 380px) {
    .btn { padding: 14px 20px; font-size: 13px; }
    .btn.primary { padding: 16px 26px; }
    .preset { padding: 12px 6px 10px; }
    .preset .t-main { font-size: 28px; }
    .preset .t-interval { font-size: 18px; }
    header { gap: 8px; }
    .brand { font-size: 16px; }
    .version { font-size: 10px; }
    .volume-row { padding: 5px 10px 5px 8px; gap: 6px; }
  }
  @media (min-height: 800px) {
    .ring-wrap { width: min(74vw, 380px); }
  }
</style>
</head>
<body data-phase="idle">
  <div class="app">
    <header>
      <div class="brand">Stretch <b>Timer</b></div>
      <div class="volume-row" id="volumeRow" aria-label="音量">
        <svg class="vol-icon" id="volIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06A7 7 0 0 1 14 18.7v2.06A9 9 0 0 0 14 3.23z"/>
        </svg>
        <input type="range" id="volumeSlider" class="vol-slider" min="0" max="100" step="1" value="50" aria-label="音量調節" />
        <span class="vol-val" id="volumeValue">50</span>
      </div>
      <div class="version">v0.3.2</div>
    </header>

    <section class="presets" aria-label="プリセット選択">
      <button class="preset active" data-main="30" data-interval="5">
        <div class="preset-label">STANDARD</div>
        <div class="preset-times">
          <span class="t-main">30</span><span class="t-unit">s</span>
          <span class="t-sep">/</span>
          <span class="t-interval">5</span><span class="t-unit">s</span>
        </div>
        <div class="preset-meta">M / I</div>
      </button>
      <button class="preset" data-main="20" data-interval="4">
        <div class="preset-label">QUICK</div>
        <div class="preset-times">
          <span class="t-main">20</span><span class="t-unit">s</span>
          <span class="t-sep">/</span>
          <span class="t-interval">4</span><span class="t-unit">s</span>
        </div>
        <div class="preset-meta">M / I</div>
      </button>
      <button class="preset" data-main="10" data-interval="4">
        <div class="preset-label">SHORT</div>
        <div class="preset-times">
          <span class="t-main">10</span><span class="t-unit">s</span>
          <span class="t-sep">/</span>
          <span class="t-interval">4</span><span class="t-unit">s</span>
        </div>
        <div class="preset-meta">M / I</div>
      </button>
    </section>

    <main class="stage">
      <div class="phase-label" id="phaseLabel">READY</div>
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="track" cx="100" cy="100" r="94"></circle>
          <circle class="progress" id="ringProgress" cx="100" cy="100" r="94"
                  stroke-dasharray="590.62" stroke-dashoffset="590.62"></circle>
        </svg>
        <div class="time" id="timeDisplay">30<span class="sec">s</span></div>
      </div>
      <div class="cycle-info">
        <span><b>サイクル</b> <span id="cycleCount">0</span></span>
        &nbsp;·&nbsp;
        <span><b>経過</b> <span id="totalElapsed">00:00</span></span>
      </div>
    </main>

    <div class="controls">
      <button class="btn ghost" id="stopBtn" aria-label="完全停止" disabled>
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
        停止
      </button>
      <button class="btn primary" id="playBtn" aria-label="再生/一時停止">
        <svg class="icon" id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span id="playLabel">スタート</span>
      </button>
    </div>

    <div class="hint" id="hint">▶ ボタンで開始。最初に5秒のカウントが入ります</div>
  </div>

<script>
/* ============================================================
   ストレッチタイマー v0.3.2
   - v0.3.1からの変更：
     * ヘッダレイアウト変更
       - 「Stretch Timer」タイトル / 音量バー / バージョン番号を
         同じ1行に統合（3カラム flex 構成）
       - 音量バーは中央でflex:1により可動幅を確保
       - スマホ幅(<=380px)でも1行を維持するためアイコン/数値を小型化
     * 機能・効果音・タイマー挙動はv0.3.1と同一
   ============================================================ */

/* ---------- 設定 ---------- */
const CONFIG = {
  COUNTDOWN_FROM: 3,           // 終了X秒前からカウント音
  TRANSITION_GAP_MS: 1000,     // メイン→インターバル間の間
  PRESETS: [
    { name: 'STANDARD', main: 30, interval: 5 },
    { name: 'QUICK',    main: 20, interval: 4 }, // v0.3.1: 3→4
    { name: 'SHORT',    main: 10, interval: 4 }, // v0.3.1: 3→4
  ],
  DEFAULT_PRESET_INDEX: 0,
  // 音量関連
  VOLUME_DEFAULT: 50,           // スライダー初期値(0-100)
  VOLUME_GAIN_AT_MAX: 1.4,      // slider=100 のときのmasterGain値
                                // 50 → 0.7 (旧バージョンと等価)
  VOLUME_STORAGE_KEY: 'stretchTimer.volume',
};

/* ---------- DOM ---------- */
const el = {
  body: document.body,
  presets: document.querySelectorAll('.preset'),
  phaseLabel: document.getElementById('phaseLabel'),
  time: document.getElementById('timeDisplay'),
  ring: document.getElementById('ringProgress'),
  cycle: document.getElementById('cycleCount'),
  totalElapsed: document.getElementById('totalElapsed'),
  playBtn: document.getElementById('playBtn'),
  playIcon: document.getElementById('playIcon'),
  playLabel: document.getElementById('playLabel'),
  stopBtn: document.getElementById('stopBtn'),
  hint: document.getElementById('hint'),
  volumeRow: document.getElementById('volumeRow'),
  volumeSlider: document.getElementById('volumeSlider'),
  volumeValue: document.getElementById('volumeValue'),
  volIcon: document.getElementById('volIcon'),
};

const RING_CIRCUMFERENCE = 2 * Math.PI * 94;
el.ring.setAttribute('stroke-dasharray', RING_CIRCUMFERENCE.toFixed(2));
el.ring.setAttribute('stroke-dashoffset', RING_CIRCUMFERENCE.toFixed(2));

/* ---------- 状態 ---------- */
const State = {
  IDLE: 'idle',
  PREP: 'prep',
  MAIN: 'main',
  INTERVAL: 'interval',
};
let state = State.IDLE;
let isPaused = false;
let phaseStartTs = 0;
let phaseDuration = 0;
let pausedRemaining = 0;
let cycleCount = 0;
let totalElapsedSec = 0;
let lastTickTs = 0;
let beepedSecond = -1;
let rafId = null;
let transitionTimerId = null;

// 現在のプリセット
let currentPresetIndex = CONFIG.DEFAULT_PRESET_INDEX;
function getMainSec()     { return CONFIG.PRESETS[currentPresetIndex].main; }
function getIntervalSec() { return CONFIG.PRESETS[currentPresetIndex].interval; }
function getPrepSec()     { return CONFIG.PRESETS[currentPresetIndex].interval; }

// 音量(0-100)
let volumeLevel = CONFIG.VOLUME_DEFAULT;

/* ============================================================
   オーディオエンジン
   - メイン  = 高音域(1000-2600Hz)、明るい金属/ベル系
   - インターバル = 低音域(100-330Hz)、ローパスの温かいパッド系
   - v0.3.1: intervalTickのgainを1.4倍に増強
   - masterGain値はsetMasterGain()で随時更新可能
   ============================================================ */
const Audio = (() => {
  let ctx = null;
  let masterGain = null;

  function ensure() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = ctx.createGain();
      masterGain.gain.value = volumeToGain(volumeLevel);
      masterGain.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function setMasterGain(g) {
    if (!ctx) return; // まだ初期化されていない場合は何もしない（初期化時に最新値で立ち上がる）
    // 急激な変化を避けてクリックノイズを防ぐ
    masterGain.gain.cancelScheduledValues(ctx.currentTime);
    masterGain.gain.setTargetAtTime(g, ctx.currentTime, 0.02);
  }

  function tone({ freq, type = 'sine', dur = 0.4, attack = 0.005, gain = 0.3, detune = 0, dest = null }) {
    const c = ensure();
    const t0 = c.currentTime;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.detune.value = detune;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(dest || masterGain);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function softTone(opts) {
    const c = ensure();
    const filter = c.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = opts.cutoff || 800;
    filter.Q.value = 0.7;
    filter.connect(masterGain);
    tone({ ...opts, dest: filter });
  }

  // ---------- MAIN（メイン）系：高音・明るい・覚醒 ----------
  function mainStart() {
    ensure();
    const notes = [1046.5, 1318.5, 1568.0]; // C6, E6, G6
    notes.forEach((f, i) => {
      setTimeout(() => {
        tone({ freq: f,     type: 'triangle', dur: 0.32, attack: 0.002, gain: 0.30 });
        tone({ freq: f * 2, type: 'sine',     dur: 0.40, attack: 0.005, gain: 0.10 });
      }, i * 70);
    });
    setTimeout(() => tone({ freq: 2093, type: 'sine', dur: 0.55, attack: 0.01, gain: 0.08 }), 220);
  }

  function mainTick() {
    tone({ freq: 784,  type: 'triangle', dur: 0.11, attack: 0.004, gain: 0.22 });
    tone({ freq: 1175, type: 'sine',     dur: 0.09, attack: 0.006, gain: 0.07 });
  }

  function mainEnd() {
    ensure();
    tone({ freq: 1046.5, type: 'triangle', dur: 0.95, attack: 0.003, gain: 0.30 });
    tone({ freq: 1568.0, type: 'sine',     dur: 1.00, attack: 0.005, gain: 0.18 });
    tone({ freq: 2093.0, type: 'sine',     dur: 0.90, attack: 0.010, gain: 0.08 });
  }

  // ---------- INTERVAL（インターバル）系：低音・温かい・休息 ----------
  function intervalStart() {
    softTone({ freq: 110,    type: 'sine',     dur: 1.10, attack: 0.10, gain: 0.20, cutoff: 600 });
    softTone({ freq: 220,    type: 'sine',     dur: 1.20, attack: 0.15, gain: 0.30, cutoff: 700 });
    softTone({ freq: 329.63, type: 'triangle', dur: 1.10, attack: 0.20, gain: 0.16, cutoff: 700 });
  }

  // v0.3.1: gainを1.4倍に増強（0.28→0.392, 0.20→0.28）
  // ローパスで丸められて聞き取りづらかったため、知覚音量を引き上げる
  function intervalTick() {
    softTone({ freq: 196, type: 'sine',     dur: 0.18, attack: 0.002, gain: 0.392, cutoff: 500 });
    softTone({ freq: 98,  type: 'triangle', dur: 0.20, attack: 0.003, gain: 0.280, cutoff: 350 });
  }

  function prepTick() {
    tone({ freq: 660, type: 'sine', dur: 0.14, attack: 0.003, gain: 0.20 });
  }

  return { ensure, setMasterGain, mainStart, mainEnd, mainTick, intervalStart, intervalTick, prepTick };
})();

/* ============================================================
   ユーティリティ
   ============================================================ */
function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }

function fmtMSS(totalSec) {
  const m = Math.floor(totalSec / 60);
  const s = Math.floor(totalSec % 60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function getIdleHint() {
  return `▶ ボタンで開始。最初に${getPrepSec()}秒のカウントが入ります`;
}

/* 音量(0-100) → AudioContextのgain値(0〜VOLUME_GAIN_AT_MAX)に変換 */
function volumeToGain(v) {
  const clamped = clamp(v, 0, 100);
  return (clamped / 100) * CONFIG.VOLUME_GAIN_AT_MAX;
}

/* ============================================================
   音量制御
   ============================================================ */
function loadVolumeFromStorage() {
  try {
    const raw = localStorage.getItem(CONFIG.VOLUME_STORAGE_KEY);
    if (raw === null) return CONFIG.VOLUME_DEFAULT;
    const v = parseInt(raw, 10);
    return Number.isFinite(v) ? clamp(v, 0, 100) : CONFIG.VOLUME_DEFAULT;
  } catch (_) {
    return CONFIG.VOLUME_DEFAULT;
  }
}

function saveVolumeToStorage(v) {
  try { localStorage.setItem(CONFIG.VOLUME_STORAGE_KEY, String(v)); } catch (_) { /* noop */ }
}

function setVolume(v, { save = true } = {}) {
  volumeLevel = clamp(parseInt(v, 10) || 0, 0, 100);
  el.volumeSlider.value = String(volumeLevel);
  el.volumeValue.textContent = String(volumeLevel);
  el.volumeSlider.style.setProperty('--vol-pct', `${volumeLevel}%`);
  el.volumeRow.setAttribute('data-muted', volumeLevel === 0 ? 'true' : 'false');
  // アイコンを音量に応じて切り替え
  updateVolumeIcon(volumeLevel);
  Audio.setMasterGain(volumeToGain(volumeLevel));
  if (save) saveVolumeToStorage(volumeLevel);
}

function updateVolumeIcon(v) {
  // 0: ミュート、1-33: 小、34-66: 中、67-100: 大
  let path;
  if (v === 0) {
    // ミュートアイコン
    path = 'M3 9v6h4l5 5V4L7 9H3zm13.59 3L19 9.41 17.59 8 15 10.59 12.41 8 11 9.41 13.59 12 11 14.59 12.41 16 15 13.41 17.59 16 19 14.59 16.59 12z';
  } else if (v <= 33) {
    path = 'M3 9v6h4l5 5V4L7 9H3z';
  } else if (v <= 66) {
    path = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12z';
  } else {
    path = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06A7 7 0 0 1 14 18.7v2.06A9 9 0 0 0 14 3.23z';
  }
  el.volIcon.innerHTML = `<path d="${path}"/>`;
}

el.volumeSlider.addEventListener('input', (e) => {
  setVolume(e.target.value);
});

/* ============================================================
   プリセット選択
   ============================================================ */
function selectPreset(index) {
  if (index < 0 || index >= CONFIG.PRESETS.length) return;
  currentPresetIndex = index;
  el.presets.forEach((p, i) => p.classList.toggle('active', i === index));
  if (state === State.IDLE) {
    updateIdleDisplay();
  }
}

el.presets.forEach((p, i) => {
  p.addEventListener('click', () => selectPreset(i));
});

/* ============================================================
   表示更新
   ============================================================ */
function setAccent(phase) {
  el.body.setAttribute('data-phase', phase);
  const root = document.documentElement.style;
  if (phase === 'main') {
    root.setProperty('--accent', 'var(--main)');
    root.setProperty('--accent-soft', 'var(--main-soft)');
    root.setProperty('--accent-glow', 'var(--main-glow)');
  } else if (phase === 'interval') {
    root.setProperty('--accent', 'var(--interval)');
    root.setProperty('--accent-soft', 'var(--interval-soft)');
    root.setProperty('--accent-glow', 'var(--interval-glow)');
  } else if (phase === 'prep') {
    root.setProperty('--accent', 'var(--prep)');
    root.setProperty('--accent-soft', 'var(--prep-soft)');
    root.setProperty('--accent-glow', 'rgba(201,184,214,0.25)');
  } else {
    root.setProperty('--accent', 'var(--main)');
    root.setProperty('--accent-soft', 'var(--main-soft)');
    root.setProperty('--accent-glow', 'var(--main-glow)');
  }
}

function setPhaseLabel(phase) {
  const map = { idle: 'READY', prep: 'GET READY', main: 'STRETCH', interval: 'REST' };
  el.phaseLabel.textContent = map[phase] || 'READY';
}

function setTimeDisplay(sec) {
  const s = Math.max(0, Math.ceil(sec));
  el.time.innerHTML = `${s}<span class="sec">s</span>`;
}

function setRing(progressRatio) {
  const offset = RING_CIRCUMFERENCE * (1 - progressRatio);
  el.ring.setAttribute('stroke-dashoffset', offset.toFixed(2));
}

function updateIdleDisplay() {
  setPhaseLabel(State.IDLE);
  setAccent(State.IDLE);
  setTimeDisplay(getMainSec());
  setRing(0);
  el.cycle.textContent = '0';
  el.totalElapsed.textContent = '00:00';
  el.hint.textContent = getIdleHint();
}

/* ============================================================
   状態遷移
   ============================================================ */
function startPhase(nextState) {
  state = nextState;
  beepedSecond = -1;
  setPhaseLabel(state);
  setAccent(state);

  if (state === State.PREP) {
    phaseDuration = getPrepSec();
    el.hint.textContent = 'まもなくスタート…';
  } else if (state === State.MAIN) {
    phaseDuration = getMainSec();
    if (phaseDuration <= 0) {
      startPhase(State.INTERVAL);
      return;
    }
    Audio.mainStart();
    el.hint.textContent = 'ストレッチを保持してください';
  } else if (state === State.INTERVAL) {
    phaseDuration = getIntervalSec();
    Audio.intervalStart();
    el.hint.textContent = '深呼吸、次の準備を';
    cycleCount += 1;
    el.cycle.textContent = String(cycleCount);
  }
  phaseStartTs = performance.now();
}

function nextPhase() {
  if (state === State.PREP) {
    startPhase(State.MAIN);
  } else if (state === State.MAIN) {
    Audio.mainEnd();
    state = '_transition';
    el.hint.textContent = 'よくできました。1秒の間…';
    transitionTimerId = setTimeout(() => {
      transitionTimerId = null;
      if (state === '_transition') startPhase(State.INTERVAL);
    }, CONFIG.TRANSITION_GAP_MS);
  } else if (state === State.INTERVAL) {
    startPhase(State.MAIN);
  }
}

/* ============================================================
   メインループ
   ============================================================ */
function tick(now) {
  if (!isPaused && state !== State.IDLE && state !== '_transition') {
    const elapsed = (now - phaseStartTs) / 1000;
    const remaining = phaseDuration - elapsed;

    if (lastTickTs > 0) {
      totalElapsedSec += (now - lastTickTs) / 1000;
      el.totalElapsed.textContent = fmtMSS(totalElapsedSec);
    }
    lastTickTs = now;

    setTimeDisplay(remaining);
    setRing(clamp(elapsed / phaseDuration, 0, 1));

    const secCeil = Math.ceil(remaining);
    if (remaining > 0 && remaining <= CONFIG.COUNTDOWN_FROM && secCeil !== beepedSecond) {
      beepedSecond = secCeil;
      if (state === State.PREP) Audio.prepTick();
      else if (state === State.MAIN) Audio.mainTick();
      else if (state === State.INTERVAL) Audio.intervalTick();
      el.time.classList.remove('tick');
      void el.time.offsetWidth;
      el.time.classList.add('tick');
    }

    if (remaining <= 0) {
      nextPhase();
    }
  } else {
    lastTickTs = now;
  }
  rafId = requestAnimationFrame(tick);
}

/* ============================================================
   操作（再生/一時停止/停止）
   ============================================================ */
function play() {
  Audio.ensure();
  // ensure後にmasterGainがある場合は現在値を反映（初期化直後の同期）
  Audio.setMasterGain(volumeToGain(volumeLevel));

  if (state === State.IDLE) {
    cycleCount = 0;
    totalElapsedSec = 0;
    el.cycle.textContent = '0';
    el.totalElapsed.textContent = '00:00';
    isPaused = false;
    lastTickTs = 0;
    startPhase(State.PREP);
    setPlayingUI(true);
    if (!rafId) rafId = requestAnimationFrame(tick);
  } else if (isPaused) {
    isPaused = false;
    if (state === '_transition') {
      startPhase(State.INTERVAL);
    } else {
      phaseStartTs = performance.now() - (phaseDuration - pausedRemaining) * 1000;
    }
    lastTickTs = 0;
    setPlayingUI(true);
    el.hint.textContent = '再開しました';
  } else {
    isPaused = true;
    if (state === '_transition' && transitionTimerId) {
      clearTimeout(transitionTimerId);
      transitionTimerId = null;
    }
    const elapsed = (performance.now() - phaseStartTs) / 1000;
    pausedRemaining = Math.max(0, phaseDuration - elapsed);
    setPlayingUI(false, true);
    el.hint.textContent = '一時停止中  ▶ で再開';
  }
}

function stopAll() {
  state = State.IDLE;
  isPaused = false;
  cycleCount = 0;
  totalElapsedSec = 0;
  beepedSecond = -1;
  pausedRemaining = 0;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (transitionTimerId) { clearTimeout(transitionTimerId); transitionTimerId = null; }
  updateIdleDisplay();
  setPlayingUI(false, false);
  el.hint.textContent = '停止しました。▶ で再開できます';
}

function setPlayingUI(isPlaying, isPausedUI = false) {
  el.stopBtn.disabled = !isPlaying && !isPausedUI;
  if (isPlaying) {
    el.playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
    el.playLabel.textContent = '一時停止';
  } else {
    el.playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    el.playLabel.textContent = isPausedUI ? '再開' : 'スタート';
  }
}

el.playBtn.addEventListener('click', play);
el.stopBtn.addEventListener('click', stopAll);

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') {
    // 音量スライダーフォーカス中は↑↓で5刻み調整
    if (e.target === el.volumeSlider) {
      if (e.code === 'ArrowUp' || e.code === 'ArrowRight') {
        e.preventDefault();
        setVolume(volumeLevel + 5);
      } else if (e.code === 'ArrowDown' || e.code === 'ArrowLeft') {
        e.preventDefault();
        setVolume(volumeLevel - 5);
      }
    }
    return;
  }
  if (e.code === 'Space') { e.preventDefault(); play(); }
  else if (e.code === 'Escape') { stopAll(); }
  else if (e.code === 'Digit1' || e.code === 'Numpad1') selectPreset(0);
  else if (e.code === 'Digit2' || e.code === 'Numpad2') selectPreset(1);
  else if (e.code === 'Digit3' || e.code === 'Numpad3') selectPreset(2);
});

/* ============================================================
   初期化
   ============================================================ */
volumeLevel = loadVolumeFromStorage();
setVolume(volumeLevel, { save: false }); // UI反映のみ（保存はしない）
selectPreset(CONFIG.DEFAULT_PRESET_INDEX);
updateIdleDisplay();

// 画面スリープ抑止
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (_) { /* noop */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state !== State.IDLE) requestWakeLock();
});
el.playBtn.addEventListener('click', requestWakeLock, { once: false });
</script>
</body>
